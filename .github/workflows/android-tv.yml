name: Android TV APK

# 每次推送到 main：跑测试 → 构建 TV 网页包 → 打包签名 APK → 发布到 Releases（附更新记录）。
# 也可以在 Actions 页面手动运行（可选择只构建、不发布）。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'COPYRIGHT'
      - 'licenses/**'
  workflow_dispatch:
    inputs:
      publish:
        description: '发布到 Releases'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: false

env:
  # 仓库 .npmrc 指向国内镜像；GitHub 机房直接用官方源更快更稳。
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/

      - name: Unit tests
        run: pnpm test

      - name: Export training content
        run: pnpm export:tv-content

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          BASE=$(grep -E '^versionBase=' android/version.properties | cut -d= -f2 | tr -d '[:space:]')
          CODE=${{ github.run_number }}
          NAME="${BASE}.${CODE}"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}" >> "$GITHUB_OUTPUT"
          echo "版本 ${NAME}（versionCode ${CODE}）"

      # 签名证书放在仓库 Secrets（不进代码库）。没配置时用临时证书兜底，保证流程不中断，
      # 但临时证书每次都不同，无法覆盖安装——发布说明里会醒目提示。
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "QILIAN_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "QILIAN_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "QILIAN_KEY_ALIAS=$KEY_ALIAS"
              echo "QILIAN_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "使用 Secrets 中的签名证书"
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/temp.jks" -storetype PKCS12 \
              -alias temp -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Qilian TV Temp" >/dev/null 2>&1
            {
              echo "QILIAN_KEYSTORE_FILE=$RUNNER_TEMP/temp.jks"
              echo "QILIAN_KEYSTORE_PASSWORD=$PASS"
              echo "QILIAN_KEY_ALIAS=temp"
              echo "QILIAN_KEY_PASSWORD=$PASS"
            } >> "$GITHUB_ENV"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置签名 Secrets（ANDROID_KEYSTORE_BASE64 等），本次使用临时证书，新版本无法覆盖安装旧版本。"
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :qilian:testDebugUnitTest --tests 'com.qilian.tv.RulesTest' :app:assembleRelease \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }}

      - name: Collect APK
        id: apk
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | grep -v unsigned | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::没有找到已签名的 APK"
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          mkdir -p dist-apk
          OUT="dist-apk/NanpoXiangqi-${{ steps.version.outputs.tag }}.apk"
          cp "$APK" "$OUT"
          (cd dist-apk && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256")
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$OUT" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanpoXiangqi-${{ steps.version.outputs.tag }}
          path: dist-apk/
          retention-days: 30

      - name: Release notes
        if: github.event_name == 'push' || inputs.publish
        run: |
          PREV=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          {
            echo "## 南坡象棋 ${{ steps.version.outputs.tag }}"
            echo
            echo "- 构建时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')（北京时间）"
            echo "- 提交：\`${GITHUB_SHA::7}\`"
            echo "- 安装包：\`NanpoXiangqi-${{ steps.version.outputs.tag }}.apk\`（${{ steps.apk.outputs.size }}）"
            if [ "${{ steps.signing.outputs.stable }}" != "true" ]; then
              echo
              echo "> ⚠️ 本版本使用临时签名证书（仓库未配置签名 Secrets），安装前需先卸载旧版本。"
            fi
            echo
            echo "### 更新记录"
            if [ -n "$PREV" ]; then
              git log "$PREV"..HEAD --no-merges --pretty=format:'- %s（`%h`）' | head -n 60
              echo
              echo
              echo "完整对比：https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${{ steps.version.outputs.tag }}"
            else
              echo "- 原生 Android TV 版本"
              git log --no-merges --pretty=format:'- %s（`%h`）' -n 15
              echo
            fi
            echo
            echo "### 安装"
            echo "1. 下载下方的 APK，用 U 盘、局域网传输或「当贝助手」等工具装到电视 / 盒子上；"
            echo "2. 同一签名的新版本可以直接覆盖安装，棋谱和训练进度会保留；"
            echo "3. 遥控器：方向键移动焦点，OK 确认，返回键后退；在页面最左侧按左键展开导航。"
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" \
            "${{ steps.apk.outputs.path }}" \
            "${{ steps.apk.outputs.path }}.sha256" \
            --title "南坡象棋 $TAG" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            --latest
